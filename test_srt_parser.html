<!DOCTYPE html>
<html>
<head>
    <title>SRT Parser Test</title>
</head>
<body>
    <h1>SRT Parser Test</h1>
    <textarea id="srtInput" rows="10" cols="80" placeholder="Paste SRT content here...">1
00:00:01,000 --> 00:00:03,000
Hello world

2
00:00:04,000 --> 00:00:06,000
This is a test subtitle</textarea>
    <br><br>
    <button onclick="testParser()">Test Parser</button>
    <br><br>
    <pre id="output"></pre>

    <script>
        // Load the parseSrt function from autoCaptions.js
        function parseSrt(raw) {
            var text = String(raw || '')
                .replace(/^﻿/, '')
                .replace(/\u0000/g, '')
                .replace(/\r\n?/g, '\n');
            if (/^\s*WEBVTT\b/i.test(text)) return [];
            var cues = [];
            var TIME = /(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?/;
            var lines = text.split('\n');
            for (var i = 0; i < lines.length; i++) {
                if (!/(?:-->|→)/.test(lines[i])) continue;
                var parts = lines[i].split(/\s*(?:-->|→)\s*/);
                var m1 = TIME.exec(parts[0]); var m2 = TIME.exec(parts[1] || '');
                if (!m1 || !m2) continue;
                function toSec(m) {
                    var h = parseInt(m[1] || '0', 10), mn = parseInt(m[2], 10), s = parseInt(m[3], 10);
                    var ms = parseInt(((m[4] || '0') + '00').slice(0, 3), 10);
                    return h * 3600 + mn * 60 + s + ms / 1000;
                }
                var bodyLines = [];
                for (var j = i + 1; j < lines.length; j++) {
                    var trimmed = lines[j].trim();
                    if (!trimmed || /(?:-->|→)/.test(lines[j])) break;
                    if (/^\d+$/.test(trimmed) && j + 1 < lines.length && /(?:-->|→)/.test(lines[j + 1])) break;
                    bodyLines.push(lines[j]);
                }
                var body = bodyLines.join('\n')
                    .replace(/<[^>]+>/g, '')
                    .replace(/\{\\[^}]*\}/g, '')
                    .trim();
                if (!body) continue;
                var cueStart = toSec(m1), cueEnd = toSec(m2);
                if (cueEnd > cueStart) cues.push({ text: body, start: cueStart, end: cueEnd });
            }
            cues.sort(function (a, b) { return a.start - b.start; });
            return cues;
        }

        function testParser() {
            var srtContent = document.getElementById('srtInput').value;
            var result = parseSrt(srtContent);
            document.getElementById('output').textContent = JSON.stringify(result, null, 2);
        }
    </script>
</body>
</html>
