<!DOCTYPE html>
<html>
<head>
    <title>Panel Switching Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #4da3ff; }
        .test-section { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .test-result { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .success { background: #1a4d1a; color: #57d7a0; }
        .error { background: #4d1a1a; color: #ff7180; }
        .warning { background: #4d4d1a; color: #ffd700; }
        .info { background: #1a1a4d; color: #4da3ff; }
        button { background: #4da3ff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #3a8ce6; }
        button:disabled { background: #666; cursor: not-allowed; }
        pre { background: #1a1a1a; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin: 15px 0; }
        .panel-btn { padding: 15px; text-align: center; background: #3a3a3a; border: 2px solid #4da3ff; border-radius: 8px; cursor: pointer; }
        .panel-btn:hover { background: #4a4a4a; }
        .panel-btn.active { background: #4da3ff; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel Switching Test Suite</h1>
        <p>Test the panel switching functionality after the caption fix changes.</p>
        
        <div class="test-section">
            <h2>Available Panels</h2>
            <div class="panel-grid" id="panelGrid">
                <div class="panel-btn" data-panel="captions">CAPTIONS</div>
                <div class="panel-btn" data-panel="library">LIBRARY</div>
                <div class="panel-btn" data-panel="silence">SILENCE</div>
                <div class="panel-btn" data-panel="beat">BEAT</div>
                <div class="panel-btn" data-panel="audio">AUDIO</div>
                <div class="panel-btn" data-panel="motion">MOTION</div>
                <div class="panel-btn" data-panel="punch">PUNCH</div>
                <div class="panel-btn" data-panel="composer">TOOLS</div>
                <div class="panel-btn" data-panel="doctor">DOCTOR</div>
                <div class="panel-btn" data-panel="multicam">MULTI</div>
            </div>
        </div>

        <div class="test-section">
            <h2>Test Controls</h2>
            <button onclick="runAllTests()">Run All Tests</button>
            <button onclick="testPanelSwitcher()">Test PanelSwitcher</button>
            <button onclick="testOrbitRailRouter()">Test OrbitRailRouter</button>
            <button onclick="testFallbackMethods()">Test Fallback Methods</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        function addResult(type, title, message) {
            const resultsDiv = document.getElementById('results');
            const section = document.createElement('div');
            section.className = 'test-section';
            section.innerHTML = `
                <div class="test-result ${type}">${title}</div>
                <p>${message}</p>
            `;
            resultsDiv.appendChild(section);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        function runAllTests() {
            clearResults();
            addResult('info', 'Starting Tests', 'Running comprehensive panel switching tests...');
            
            testPanelSwitcher();
            testOrbitRailRouter();
            testFallbackMethods();
            testPanelVisibility();
            testShelfButtons();
            
            addResult('info', 'Tests Complete', 'Review the results above for any issues.');
        }

        function testPanelSwitcher() {
            try {
                if (typeof PanelSwitcher !== 'undefined') {
                    addResult('success', 'PanelSwitcher Available', 'PanelSwitcher utility is loaded and available');
                    
                    // Test individual methods
                    if (typeof PanelSwitcher.switchTo === 'function') {
                        addResult('success', 'PanelSwitcher.switchTo', 'switchTo method is available');
                    } else {
                        addResult('error', 'PanelSwitcher.switchTo', 'switchTo method is not available');
                    }
                    
                    if (typeof PanelSwitcher.getActive === 'function') {
                        addResult('success', 'PanelSwitcher.getActive', 'getActive method is available');
                    } else {
                        addResult('error', 'PanelSwitcher.getActive', 'getActive method is not available');
                    }
                    
                    if (typeof PanelSwitcher.isActive === 'function') {
                        addResult('success', 'PanelSwitcher.isActive', 'isActive method is available');
                    } else {
                        addResult('error', 'PanelSwitcher.isActive', 'isActive method is not available');
                    }
                } else {
                    addResult('warning', 'PanelSwitcher Not Available', 'PanelSwitcher utility is not loaded - fallback methods will be used');
                }
            } catch (e) {
                addResult('error', 'PanelSwitcher Test Failed', e.message);
            }
        }

        function testOrbitRailRouter() {
            try {
                if (typeof OrbitRailRouter !== 'undefined') {
                    addResult('success', 'OrbitRailRouter Available', 'OrbitRailRouter is loaded and available');
                    
                    if (typeof OrbitRailRouter.open === 'function') {
                        addResult('success', 'OrbitRailRouter.open', 'open method is available');
                    } else {
                        addResult('error', 'OrbitRailRouter.open', 'open method is not available');
                    }
                } else {
                    addResult('warning', 'OrbitRailRouter Not Available', 'OrbitRailRouter is not loaded - fallback methods will be used');
                }
            } catch (e) {
                addResult('error', 'OrbitRailRouter Test Failed', e.message);
            }
        }

        function testFallbackMethods() {
            try {
                let fallbacksAvailable = 0;
                
                if (typeof _showService === 'function') {
                    addResult('success', '_showService Available', 'Legacy _showService method is available');
                    fallbacksAvailable++;
                } else {
                    addResult('warning', '_showService Not Available', 'Legacy _showService method is not available');
                }
                
                if (document.getElementById('autoCaptionsView')) {
                    addResult('success', 'DOM Elements Available', 'Required DOM elements for manual switching are present');
                    fallbacksAvailable++;
                } else {
                    addResult('error', 'DOM Elements Missing', 'Required DOM elements for manual switching are missing');
                }
                
                if (fallbacksAvailable > 0) {
                    addResult('success', 'Fallback Methods', `${fallbacksAvailable} fallback method(s) available`);
                } else {
                    addResult('error', 'Fallback Methods', 'No fallback methods available - panel switching may fail');
                }
            } catch (e) {
                addResult('error', 'Fallback Methods Test Failed', e.message);
            }
        }

        function testPanelVisibility() {
            try {
                const views = document.querySelectorAll('.orbit-view-panel');
                if (views.length > 0) {
                    addResult('success', 'Panel Views Found', `${views.length} panel view(s) found in DOM`);
                    
                    let visibleCount = 0;
                    views.forEach(view => {
                        if (view.style.display !== 'none') {
                            visibleCount++;
                        }
                    });
                    
                    addResult('info', 'Visible Panels', `${visibleCount} panel(s) currently visible`);
                } else {
                    addResult('warning', 'Panel Views Not Found', 'No panel views found in DOM - this may be normal if running outside Premiere');
                }
            } catch (e) {
                addResult('error', 'Panel Visibility Test Failed', e.message);
            }
        }

        function testShelfButtons() {
            try {
                const shelves = document.querySelectorAll('.shelf');
                if (shelves.length > 0) {
                    addResult('success', 'Shelf Buttons Found', `${shelves.length} shelf button(s) found`);
                    
                    let activeCount = 0;
                    shelves.forEach(shelf => {
                        if (shelf.classList.contains('active')) {
                            activeCount++;
                        }
                    });
                    
                    addResult('info', 'Active Shelf', `${activeCount} shelf button(s) currently active`);
                } else {
                    addResult('warning', 'Shelf Buttons Not Found', 'No shelf buttons found - this may be normal if running outside Premiere');
                }
            } catch (e) {
                addResult('error', 'Shelf Buttons Test Failed', e.message);
            }
        }

        // Panel button click handlers
        document.querySelectorAll('.panel-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const panelType = this.getAttribute('data-panel');
                
                // Update visual state
                document.querySelectorAll('.panel-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Try to switch panel
                try {
                    if (typeof PanelSwitcher !== 'undefined' && typeof PanelSwitcher.switchTo === 'function') {
                        const success = PanelSwitcher.switchTo(panelType);
                        addResult(success ? 'success' : 'error', `Switch to ${panelType}`, 
                            success ? `Successfully switched to ${panelType} panel` : `Failed to switch to ${panelType} panel`);
                    } else if (typeof OrbitRailRouter !== 'undefined' && typeof OrbitRailRouter.open === 'function') {
                        OrbitRailRouter.open(panelType);
                        addResult('success', `Switch to ${panelType}`, `Used OrbitRailRouter to switch to ${panelType}`);
                    } else {
                        addResult('warning', `Switch to ${panelType}`, `No panel switching method available - this is a test environment`);
                    }
                } catch (e) {
                    addResult('error', `Switch to ${panelType}`, e.message);
                }
            });
        });

        // Auto-run basic checks on load
        window.addEventListener('load', function() {
            addResult('info', 'Test Suite Loaded', 'Click the buttons above to run specific tests or "Run All Tests" for comprehensive testing');
        });
    </script>
</body>
</html>
